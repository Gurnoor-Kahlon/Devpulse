[project]
name = "devpulse-backend"
version = "0.1.0"
description = "DevPulse API monitoring backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.2,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<2.1",
    "fastapi>=0.115,<1",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "dnspython==2.8.0",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "trustme>=1.2,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "uv==0.12.17",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: requires a dedicated PostgreSQL test database", "mailpit: requires local Mailpit SMTP/API"]
