name: DevPulse validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  BUILDX_GIT_INFO: "false"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.15"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Install locked project dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r backend/requirements-dev.lock
          .venv/bin/python -m pip check
          npm ci --prefix frontend --no-audit --no-fund
      - name: Python style, types, and operation safeguards
        run: |
          .venv/bin/ruff check backend
          .venv/bin/ruff format --check backend
          .venv/bin/ruff check --config backend/pyproject.toml scripts containers
          .venv/bin/ruff format --check --config backend/pyproject.toml scripts containers
          (cd backend && ../.venv/bin/mypy app)
          .venv/bin/python -m pytest scripts/tests -q
      - name: Frontend checks, API contract, and native build
        working-directory: frontend
        run: |
          npm run check
          npm run api:check
          npm run build

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEVPULSE_WEB_PORT: "13000"
      DEVPULSE_MAIL_PORT: "18025"
      TEST_CONTAINER_ORIGIN: http://localhost:13000
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.15"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Install locked smoke/browser dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r backend/requirements.lock
          npm ci --prefix frontend --no-audit --no-fund
          cd frontend
          # Ubuntu 24.04 hosted runners already supply Chromium system libraries.
          npx --no-install playwright install chromium
      - name: Build pinned runtime and test images
        run: |
          python scripts/local_stack.py init
          docker compose --env-file .cache/compose.env -p devpulse-ci -f compose.yaml -f compose.test.yaml build api frontend backend-tests
      - name: Backend unit, PostgreSQL, Redis, prefork worker, and SMTP tests
        run: docker compose --env-file .cache/compose.env -p devpulse-ci -f compose.yaml -f compose.test.yaml run --rm backend-tests
      - name: Release test service ports before the isolated smoke
        run: docker compose --env-file .cache/compose.env -p devpulse-ci -f compose.yaml -f compose.test.yaml down --volumes
      - name: Real scheduling, failure/recovery, restart, and restore smoke
        run: .venv/bin/python scripts/verify_local_stack.py
      - name: Run browser against production container build
        run: |
          docker compose --env-file .cache/compose.env -p devpulse-ci -f compose.yaml -f compose.test.yaml up -d --wait --wait-timeout 180
          cd frontend
          npx --no-install playwright test containers.spec.ts
      - name: Benchmark harness smoke (100 probes; not the full performance gate)
        run: python scripts/benchmark.py --rounds 1 --output .cache/ci-benchmark-smoke.json
      - name: Remove only this job's disposable project
        if: always()
        run: docker compose --env-file .cache/compose.env -p devpulse-ci -f compose.yaml -f compose.test.yaml down --volumes --remove-orphans

  performance:
    if: github.event_name == 'workflow_dispatch'
    needs: [checks, stack]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned images from lockfiles
        run: |
          python3 scripts/local_stack.py init
          docker compose --env-file .cache/compose.env build api frontend
      - name: Require 100 monitors and at least 10000 real probes
        run: |
          python3 scripts/benchmark.py --output .cache/ci-performance.json
          python3 -c 'import json; r=json.load(open(".cache/ci-performance.json")); assert r["milestone_19_volume_met"] and r["disposable_project_removed"]'
      - name: Save only sanitized benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: controlled-performance-${{ github.run_id }}
          path: .cache/ci-performance.json
          if-no-files-found: error
          retention-days: 14
